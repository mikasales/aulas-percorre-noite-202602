<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet</title>

    <style>
        p{font-size: 100px

        }
        #gato{

            color:yellowgreen
        }

        #cachorro{
            color:burlywood
        }

    </style>

</head>
<body>
    
    <!-- CSS inline é aquele que vai dentro da própria tag -->
    <p style="color:rebeccapurple; font-size: 200px;">Mikaias</p>
    <p id="cachorro">Iggy</p>
    <p id="gato">Chaburcio</p>

</body>
</html>
