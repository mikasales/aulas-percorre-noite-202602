<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário 2 - Radio e checkbox</title>
</head>
<body>
    <header>

    </header>
    <main>

        <form action="">
            <label for="color">insira seu email</label>
            <input type="email" name="email" id="email" required="true" placeholder="xaulinmatadordeporco@gmail.com">
            <br>

            <label for="nome">Insira seu nome</label>
            <input type="text" nome="" id="nome" required="true" maxlength="50" placeholder="seu nome">

            <br>

            <label for="color">Escolha uma cor</label>
            <input type="color" name="color" id="color">
            <br>
            <br>
            
            <label for="">Avalie o atendimento</label>
            <br>
            <br>

            <input type="radio" name="estrelas" id="3estrelas" value="3">
            <label for="3estrelas">⭐⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="2estrelas" value="2">
            <label for="2estrelas">⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="" value="1">
            <label for="1estrelas">⭐</label>
            <br>
            <br>


            <label for="comentario">Deixe um comentário:</label>
            <textarea name="" id="comentario" placeholder="Seu comentario" cols="20" rows="1"></textarea>
            <br>
            <br>


            <input type="submit" value="Enviar!">
                         
        </form>


    </main>
    <footer>
